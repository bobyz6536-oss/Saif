name: Generate Oggetti Casuali Video

on:
  push:
    branches:
      - claude/higgsfield-mcp-4aIfG
    paths:
      - 'videos/oggetti-casuali/**'
      - '.github/workflows/generate-video.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install higgsfield-client httpx

      - name: Generate video scenes
        env:
          HF_API_KEY: 1c3e9ae8-a47e-4c62-8ebf-786868ed46ad
          HF_API_SECRET: c5d1f864ee91c6390bf39398223718701c8c1d8f10961488e02da58c6eebae0a
        run: |
          mkdir -p videos/oggetti-casuali/output
          cd videos/oggetti-casuali
          python generate.py --text-only

      - name: Commit results back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp videos/oggetti-casuali/output/results.json videos/oggetti-casuali/results-latest.json
          git add videos/oggetti-casuali/results-latest.json
          git diff --cached --quiet || git commit -m "ci: add generation results [skip ci]"
          git push origin HEAD

      - name: Upload generated videos
        uses: actions/upload-artifact@v4
        with:
          name: oggetti-casuali-scenes
          path: videos/oggetti-casuali/output/*.mp4
          retention-days: 7

      - name: Upload generation report
        uses: actions/upload-artifact@v4
        with:
          name: generation-report
          path: videos/oggetti-casuali/output/results.json
          retention-days: 7
