name: Generate Oggetti Casuali Video

on:
  push:
    branches:
      - claude/higgsfield-mcp-4aIfG
    paths:
      - 'videos/oggetti-casuali/generate.py'
      - 'videos/oggetti-casuali/reference.jpg'
      - '.github/workflows/generate-video.yml'

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install higgsfield-client httpx

      - name: Generate video scenes
        env:
          HF_API_KEY: afa68010-37cc-42ad-acee-af31b22e6460
          HF_API_SECRET: afa68010-37cc-42ad-acee-af31b22e6460
        run: |
          cd videos/oggetti-casuali
          python generate.py --text-only

      - name: Commit results back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp videos/oggetti-casuali/output/results.json videos/oggetti-casuali/results-latest.json
          git add videos/oggetti-casuali/results-latest.json
          git diff --cached --quiet || git commit -m "ci: add generation results [skip ci]"
          git push

      - name: Upload generated videos
        uses: actions/upload-artifact@v4
        with:
          name: oggetti-casuali-scenes
          path: videos/oggetti-casuali/output/*.mp4
          retention-days: 7

      - name: Upload generation report
        uses: actions/upload-artifact@v4
        with:
          name: generation-report
          path: videos/oggetti-casuali/output/results.json
          retention-days: 7
