name: Generate Oggetti Casuali Video

on:
  workflow_dispatch:
    inputs:
      text_only:
        description: 'Genera senza reference image (text-to-video)'
        required: false
        default: 'false'
        type: boolean

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install higgsfield-client httpx

      - name: Restore reference image from secret
        if: ${{ inputs.text_only != 'true' }}
        env:
          REFERENCE_IMAGE_B64: ${{ secrets.REFERENCE_IMAGE_B64 }}
        run: |
          if [ -n "$REFERENCE_IMAGE_B64" ]; then
            echo "$REFERENCE_IMAGE_B64" | base64 -d > videos/oggetti-casuali/reference.jpg
            echo "Reference image restored from secret."
          else
            echo "Secret REFERENCE_IMAGE_B64 not set — will use text-to-video."
          fi

      - name: Generate video scenes
        env:
          HF_API_KEY: afa68010-37cc-42ad-acee-af31b22e6460
          HF_API_SECRET: afa68010-37cc-42ad-acee-af31b22e6460
        run: |
          cd videos/oggetti-casuali
          if [ "${{ inputs.text_only }}" = "true" ]; then
            python generate.py --text-only
          else
            python generate.py
          fi

      - name: Upload generated videos
        uses: actions/upload-artifact@v4
        with:
          name: oggetti-casuali-scenes
          path: videos/oggetti-casuali/output/*.mp4
          retention-days: 7

      - name: Upload generation report
        uses: actions/upload-artifact@v4
        with:
          name: generation-report
          path: videos/oggetti-casuali/output/results.json
          retention-days: 7
